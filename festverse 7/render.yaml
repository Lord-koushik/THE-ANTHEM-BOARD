# Render Blueprint: creates the web service AND a free PostgreSQL database in one go.
databases:
  - name: festverse-db
    plan: free
    databaseName: festverse
    user: festverse

services:
  - type: web
    name: festverse
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # init_db.py only builds + seeds the schema when the database is empty, so redeploys are safe
    startCommand: python init_db.py && gunicorn app:app --workers 2 --threads 4 --timeout 90 --bind 0.0.0.0:$PORT
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: festverse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
